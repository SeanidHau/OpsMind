# 第一阶段只启动项目依赖，不启动尚未实现的后端或前端服务。
name: opsmind

services:
  postgres:
    # 固定 PostgreSQL 主版本，避免本地开发环境意外跨主版本升级。
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsmind}
      POSTGRES_USER: ${POSTGRES_USER:-opsmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsmind_dev_only}
    ports:
      # 仅暴露给本机，避免开发数据库被局域网访问。
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # 在依赖服务启动前确认 PostgreSQL 已可接收连接。
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    # 本地开发使用官方镜像；首次稳定后在提交中锁定实际镜像版本或 digest。
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  postgres_data:
  qdrant_storage:
